services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: threadfall-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  app:
    build:
      context: .
    container_name: threadfall-app
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: threadfall_memories
      THREADFALL_EMBED_DEVICE: cpu
    ports:
      - "8501:8501"
    volumes:
      - .:/app

